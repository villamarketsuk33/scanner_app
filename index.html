<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสแกนตรวจสอบสินค้า</title>
    <!-- Tailwind CSS สำหรับตกแต่ง UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse สำหรับแปลง CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Html5-Qrcode สำหรับสแกนบาร์โค้ดผ่านกล้อง -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body { background-color: #f3f4f6; font-family: 'Sarabun', sans-serif; }
        .scan-input:focus { outline: none; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.5); }
        .loading-spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4">

    <div class="bg-white rounded-xl shadow-lg w-full max-w-4xl overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 p-3 text-white text-center">
            <h1 class="text-lg font-bold">แอพพลิเคชั่น ตรวจสอบรายละเอียดสินค้า</h1>
        </div>

        <!-- Search & Control Panel -->
        <div class="p-4 border-b border-gray-100">
            <div class="flex items-center justify-between mb-3">
                <div class="flex flex-wrap space-x-3">
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="searchMode" value="barcode" checked class="form-radio text-blue-600 h-3 w-3" onchange="updateInputPlaceholder('barcode')">
                        <span class="ml-2 text-xs text-gray-700 font-medium select-none">ค้นหาด้วยบาร์โค้ด</span>
                    </label>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="searchMode" value="productCode" class="form-radio text-green-600 h-3 w-3" onchange="updateInputPlaceholder('productCode')">
                        <span class="ml-2 text-xs text-gray-700 font-medium select-none">ค้นด้วยรหัสสินค้า</span>
                    </label>
                </div>
                <div id="statusContainer" class="flex items-center" title="สถานะการเชื่อมต่อฐานข้อมูล">
                    <div id="statusLight" class="w-4 h-4 rounded-full bg-yellow-500 transition-colors duration-300"></div>
                </div>
            </div>

            <div class="relative flex space-x-2">
                <div class="relative flex-1">
                    <input type="text" id="barcodeInput" class="scan-input w-full text-xs p-2 border-2 border-gray-300 rounded-lg text-center" placeholder="คลิกที่นี่แล้วยิงบาร์โค้ด..." autofocus>
                    <button onclick="processSearch()" class="absolute right-1 top-1 bottom-1 bg-blue-600 text-white px-3 rounded-md hover:bg-blue-700 transition">
                        <i class="fas fa-search text-xs"></i>
                    </button>
                </div>
                <button onclick="startScanner()" class="bg-indigo-600 text-white px-4 rounded-lg text-xs font-medium flex items-center space-x-1 shadow-sm flex-none hover:bg-indigo-700 transition">
                    <i class="fas fa-camera"></i> <span>กล้อง</span>
                </button>
            </div>
        </div>

        <div id="resultContainer" class="hidden">
            <div class="lg:grid lg:grid-cols-2 gap-0">
                <!-- Data Detail Box -->
                <div class="p-5 space-y-3 lg:order-1">
                    <div class="border-b-2 border-blue-100 pb-2 mb-2 flex justify-between items-start">
                        <div class="pr-2 flex-1">
                            <span class="block text-gray-500 text-[9px] mb-1 font-semibold uppercase">ชื่อสินค้า</span>
                            <h2 id="productName" class="text-xl font-black text-gray-900 leading-tight">-</h2>
                        </div>
                        <div class="bg-red-50 p-2 rounded border-l-2 border-red-500 text-right flex-none">
                            <span class="block text-red-700 text-[8px] font-bold">ราคาปลีก</span>
                            <span id="displayRetailPrice" class="font-bold text-base text-red-700 leading-none">-</span>
                        </div>
                    </div>

                    <!-- Row 1: Key Info -->
                    <div class="grid grid-cols-4 gap-1.5 mb-2">
                        <div class="bg-blue-50 p-1.5 rounded"><span class="block text-gray-500 text-[8px]">บาร์โค้ด</span><span id="displayBarcode" class="font-bold text-blue-700 text-[10px] break-all">-</span></div>
                        <div class="bg-green-50 p-1.5 rounded"><span class="block text-gray-500 text-[8px]">รหัสสินค้า</span><span id="displayProductCode" class="font-bold text-green-700 text-[10px] break-all">-</span></div>
                        <div class="bg-gray-100 p-1.5 rounded text-center"><span class="block text-gray-500 text-[8px]">MASTER</span><span id="displayMaster" class="font-bold text-gray-700 text-[10px]">-</span></div>
                        <div class="bg-yellow-50 p-1.5 rounded text-center"><span class="block text-gray-500 text-[8px]">สถานะ</span><span id="displayStatus" class="font-bold text-yellow-700 text-[10px]">-</span></div>
                    </div>

                    <!-- Row 2: Department & Vendor -->
                    <div class="grid grid-cols-3 gap-1.5 mb-2">
                        <div class="bg-purple-50 p-1.5 rounded text-center flex flex-col justify-center">
                            <span class="block text-gray-500 text-[8px]">แผนก</span>
                            <span id="displayDept" class="font-bold text-purple-700 text-xs">-</span>
                        </div>
                        <div class="bg-orange-50 p-1.5 rounded col-span-2 flex flex-col justify-center">
                            <span class="block text-gray-500 text-[8px]">ผู้ขาย (รหัส : ชื่อ)</span>
                            <span id="displayVendor" class="font-bold text-orange-700 text-xs truncate">-</span>
                        </div>
                    </div>

                    <!-- Row 3: Location -->
                    <div class="grid grid-cols-2 gap-2">
                        <div class="bg-teal-50 p-2 rounded border-l-4 border-teal-500">
                            <span class="block text-teal-700 text-[8px] font-bold">Location (คลัง)</span>
                            <span id="displayLocationWH" class="font-bold text-xs text-teal-700 break-all">-</span>
                        </div>
                        <div class="bg-emerald-50 p-2 rounded border-l-4 border-emerald-500">
                            <span class="block text-emerald-700 text-[8px] font-bold">Location (หน้าร้าน)</span>
                            <span id="displayLocationShop" class="font-bold text-xs text-emerald-700 break-all">-</span>
                        </div>
                    </div>
                </div>

                <!-- Product Image View -->
                <div class="bg-gray-50 p-4 flex justify-center items-center flex-col min-h-[200px] lg:order-2 lg:border-l lg:border-gray-100 border-t border-gray-100 lg:border-t-0">
                    <div id="imageLoader" class="hidden loading-spinner mb-4"></div>
                    <img id="productImage" src="" alt="Product Image" class="max-h-56 w-full rounded shadow-sm object-contain hidden">
                    <div id="imageError" class="text-red-400 text-[10px] hidden mt-2 flex flex-col items-center">
                        <i class="fas fa-image-slash text-xl mb-2"></i>
                        <span>ไม่พบรูปภาพสินค้า</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Error Container -->
        <div id="errorContainer" class="hidden p-6 text-center">
            <div class="text-red-500 text-3xl mb-3"><i class="fas fa-times-circle"></i></div>
            <h3 class="text-base font-bold text-gray-700">ไม่พบข้อมูลสินค้า</h3>
            <p id="errorText" class="text-xs text-gray-500 mt-1">บาร์โค้ดนี้ไม่มีในระบบ</p>
        </div>
    </div>

    <!-- Camera Overlay -->
    <div id="scannerOverlay" class="hidden fixed inset-0 z-50 bg-black flex flex-col">
        <div class="flex justify-between items-center p-4 bg-gray-900 text-white flex-none">
            <span class="font-bold text-sm"><i class="fas fa-camera"></i> เล็งบาร์โค้ดให้อยู่ในกรอบ</span>
            <button onclick="stopScanner()" class="bg-red-600 px-4 py-1.5 rounded-lg text-xs font-bold shadow-md">
                ปิดกล้อง <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="flex-1 w-full bg-black flex justify-center items-center relative overflow-hidden">
            <div id="reader" class="w-full max-w-lg"></div>
        </div>
    </div>

    <script>
        // =========================================================================
        // ⚙️ CONFIGURATION SECTION
        // คำแนะนำ: หากนำขึ้น GitHub แบบ Public ควรตั้งค่า HTTP Referrer Restriction 
        // บน Google Cloud Console เพื่อป้องกันการแอบอ้างใช้ API Key
        // =========================================================================
        const SHEET_ID = '1W4-vvVaM54oKXpT0JV5ZrD806tBNZ5PJjmJs3cZYITM'; 
        const SHEET_GID = '1445016899'; 

        const API_KEY = 'AIzaSyC3YwKjlQWIElTfzPbcPKpvrqID1o1BhtI'; 
        const FOLDER_ID = '1B9NhJWPne0rwFqTY0Ap62hVq_Y5FCgV4';
        const DEFAULT_IMAGE_URL = 'https://via.placeholder.com/300?text=No+Image';

        const COLUMN_NAMES = {
            BARCODE: "บาร์โค้ต", PRODUCT_CODE: "รหัสสินค้า", NAME: "ชื่อสินค้า", DEPT: "รหัสแผนก", 
            VENDOR_ID: "รหัสผู้ขายหลัก", VENDOR_NAME: "ชื่อผู้ขายหลัก", RETAIL_PRICE: "ราคาปลีก"
        };

        let COL_INDEX = {
            BARCODE: -1, PRODUCT_CODE: -1, NAME: -1, DEPT: -1, 
            VENDOR_ID: -1, VENDOR_NAME: -1, RETAIL_PRICE: -1,
            MASTER: 2, STATUS_ITEM: 21, LOCATION_WH: 40, LOCATION_SHOP: 22
        };

        let productData = []; 
        let isDataLoaded = false;
        let html5QrCode;

        window.onload = function() {
            fetchSheetData();
            const inputEl = document.getElementById('barcodeInput');
            inputEl.addEventListener('keyup', function(event) { if (event.key === 'Enter') processSearch(); });
            
            document.addEventListener('click', () => {
                if(!document.getElementById('scannerOverlay').classList.contains('hidden')) return;
                if(document.activeElement.tagName !== 'INPUT') {
                    inputEl.focus();
                }
            });
            updateInputPlaceholder('barcode');
        };

        function updateInputPlaceholder(mode) {
            const inputEl = document.getElementById('barcodeInput');
            inputEl.placeholder = (mode === 'barcode') ? "คลิกที่นี่แล้วยิงบาร์โค้ด..." : "ป้อนรหัสสินค้า...";
            inputEl.value = ''; inputEl.focus();
        }

        function fetchSheetData() {
            const statusLight = document.getElementById('statusLight');
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`;
            Papa.parse(url, {
                download: true, header: false,
                complete: function(results) {
                    const rawData = results.data;
                    if (rawData.length > 0) {
                        mapColumnIndices(rawData[0]);
                        productData = rawData.slice(1);
                        isDataLoaded = true;
                        statusLight.className = "w-4 h-4 rounded-full bg-green-600 transition-colors duration-300";
                    }
                },
                error: function(err) { statusLight.className = "w-4 h-4 rounded-full bg-red-600 transition-colors duration-300"; }
            });
        }

        function mapColumnIndices(headerRow) {
            headerRow.forEach((colName, index) => {
                const cleanName = colName.toString().trim();
                if (cleanName === COLUMN_NAMES.BARCODE) COL_INDEX.BARCODE = index;
                if (cleanName === COLUMN_NAMES.PRODUCT_CODE) COL_INDEX.PRODUCT_CODE = index;
                if (cleanName === COLUMN_NAMES.NAME) COL_INDEX.NAME = index;
                if (cleanName === COLUMN_NAMES.DEPT) COL_INDEX.DEPT = index;
                if (cleanName === COLUMN_NAMES.VENDOR_ID) COL_INDEX.VENDOR_ID = index;
                if (cleanName === COLUMN_NAMES.VENDOR_NAME) COL_INDEX.VENDOR_NAME = index;
                if (cleanName === COLUMN_NAMES.RETAIL_PRICE) COL_INDEX.RETAIL_PRICE = index;
            });
        }

        async function processSearch() {
            const inputEl = document.getElementById('barcodeInput');
            const rawInput = inputEl.value.trim();
            if (!rawInput || !isDataLoaded) return;
            resetDisplay();
            const selectedMode = document.querySelector('input[name="searchMode"]:checked').value;
            let searchColumnIndex = (selectedMode === 'barcode') ? COL_INDEX.BARCODE : COL_INDEX.PRODUCT_CODE;
            
            let foundRow = productData.find(row => {
                if (!row[searchColumnIndex]) return false;
                let sheetVal = row[searchColumnIndex].toString().trim();
                if (sheetVal === rawInput) return true;
                if (selectedMode === 'barcode') {
                    if (sheetVal === rawInput.replace(/^0+/, '')) return true;
                    let legacyVal = rawInput;
                    if (legacyVal.startsWith('0')) legacyVal = legacyVal.substring(1);
                    if (legacyVal.length > 0) legacyVal = legacyVal.slice(0, -1);
                    if (sheetVal === legacyVal) return true;
                    if (sheetVal === rawInput.slice(0, -1)) return true;
                }
                return false;
            });

            if (foundRow) {
                const COL_E = 4; 
                const COL_AB = 27; 
                let valE = foundRow[COL_E] ? foundRow[COL_E].toString().trim() : "";
                let valAB = foundRow[COL_AB] ? foundRow[COL_AB].toString().trim() : "";
                let nextSearchKey = (valE !== "" && valE === valAB) ? valAB : valE;

                if (nextSearchKey) {
                    let nextRow = productData.find(row => row[COL_INDEX.PRODUCT_CODE] && row[COL_INDEX.PRODUCT_CODE].toString().trim() === nextSearchKey);
                    if (nextRow) {
                        foundRow = nextRow;
                    }
                }
                showResult(foundRow);
            } else {
                showError(rawInput, (selectedMode === 'barcode' ? 'บาร์โค้ด' : 'รหัสสินค้า'));
            }
            inputEl.value = ''; 
            inputEl.focus(); 
        }

        function showResult(row) {
            document.getElementById('resultContainer').classList.remove('hidden');
            document.getElementById('errorContainer').classList.add('hidden');

            const pCode = (row[COL_INDEX.PRODUCT_CODE] || "-").toString().trim().padStart(7, '0');
            const rPrice = row[COL_INDEX.RETAIL_PRICE] || "-";
            
            let formattedPrice = "-";
            if (rPrice !== "-") {
                const val = parseFloat(rPrice.toString().replace(/,/g, ''));
                if (!isNaN(val)) formattedPrice = new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB' }).format(val);
            }

            document.getElementById('displayBarcode').textContent = (row[COL_INDEX.BARCODE] || "-").toString().trim();
            document.getElementById('displayProductCode').textContent = pCode;
            document.getElementById('displayLocationWH').textContent = (row[COL_INDEX.LOCATION_WH] || "-").toString().trim();
            document.getElementById('displayLocationShop').textContent = (row[COL_INDEX.LOCATION_SHOP] || "-").toString().trim();
            document.getElementById('productName').textContent = row[COL_INDEX.NAME] || "-";
            document.getElementById('displayRetailPrice').textContent = formattedPrice;
            document.getElementById('displayDept').textContent = (row[COL_INDEX.DEPT] || "-").toString().trim().padStart(2, '0');
            document.getElementById('displayVendor').textContent = `${row[COL_INDEX.VENDOR_ID] || "-"} : ${row[COL_INDEX.VENDOR_NAME] || "-"}`;
            document.getElementById('displayMaster').textContent = row[COL_INDEX.MASTER] || "-";
            document.getElementById('displayStatus').textContent = row[COL_INDEX.STATUS_ITEM] || "-";

            findImageInDrive(pCode);
        }

        function showError(original, type) {
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('errorContainer').classList.remove('hidden');
            document.getElementById('errorText').innerHTML = `ไม่พบข้อมูล ${type}: <b>${original}</b>`;
        }

        function resetDisplay() {
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('errorContainer').classList.add('hidden');
            document.getElementById('productImage').classList.add('hidden');
            document.getElementById('productImage').src = "";
            document.getElementById('imageError').classList.add('hidden');
        }

        async function findImageInDrive(productCode) {
            const imageEl = document.getElementById('productImage');
            const loader = document.getElementById('imageLoader');
            loader.classList.remove('hidden');
            
            const query = encodeURIComponent(`name='${productCode}.png' and '${FOLDER_ID}' in parents and trashed=false`);
            try {
                const response = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&key=${API_KEY}&fields=files(id)`);
                const data = await response.json();
                loader.classList.add('hidden');
                if (data.files && data.files.length > 0) {
                    imageEl.src = `https://drive.google.com/thumbnail?id=${data.files[0].id}&sz=w1000`;
                    imageEl.classList.remove('hidden');
                } else { 
                    imageEl.src = DEFAULT_IMAGE_URL;
                    imageEl.classList.remove('hidden');
                }
            } catch (error) { 
                loader.classList.add('hidden'); 
                imageEl.src = DEFAULT_IMAGE_URL;
                imageEl.classList.remove('hidden');
            }
        }

        function startScanner() {
            document.getElementById('scannerOverlay').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 100 } },
                (decodedText) => {
                    document.getElementById('barcodeInput').value = decodedText;
                    stopScanner();
                    document.querySelector('input[name="searchMode"][value="barcode"]').checked = true;
                    processSearch();
                },
                () => { }
            ).catch(err => {
                showModalError("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตใช้งานกล้องบนอุปกรณ์ของท่าน");
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scannerOverlay').classList.add('hidden');
                    document.getElementById('barcodeInput').focus();
                }).catch(() => { 
                    document.getElementById('scannerOverlay').classList.add('hidden'); 
                    document.getElementById('barcodeInput').focus();
                });
            } else {
                document.getElementById('scannerOverlay').classList.add('hidden');
                document.getElementById('barcodeInput').focus();
            }
        }

        function showModalError(msg) {
            document.getElementById('errorContainer').classList.remove('hidden');
            document.getElementById('errorText').innerText = msg;
        }
    </script>
</body>
</html>
